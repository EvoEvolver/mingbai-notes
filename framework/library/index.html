<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>书库 · 图书讲透</title>
<meta name="description" content="把书做成交互式学习站点：人文经典导读、数理教科书、论文讲解。">
<style>
:root{--paper:#f6f1e7;--paper2:#efe6d4;--ink:#1f1b16;--muted:#6b6257;--line:#d9cdb6;--accent:#9b2c1f;--gold:#b8862b;--blue:#2c4a6e;--green:#3c6b4a;--violet:#5b3f7a;
  --card:#fffdf8;--shadow:0 1px 2px rgba(60,40,10,.08),0 8px 24px rgba(60,40,10,.08);
  --serif:"Noto Serif CJK SC","Source Han Serif SC","Songti SC",Georgia,serif;--sans:"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.75 var(--sans);background-image:radial-gradient(rgba(120,90,40,.05) 1px,transparent 1px);background-size:22px 22px}
main{max-width:1180px;margin:0 auto;padding:0 22px 100px}
header{padding:80px 0 30px}
.kicker{font-size:13px;letter-spacing:.18em;color:var(--accent);font-weight:600}
h1{font-family:var(--serif);font-size:clamp(40px,6vw,64px);margin:6px 0 4px}
.sub{color:var(--muted);font-size:18px;max-width:760px}
.stats{display:flex;gap:12px;flex-wrap:wrap;margin:26px 0 8px}
.stat{background:var(--card);box-shadow:var(--shadow);border-radius:14px;padding:10px 18px}
.stat b{font-family:var(--serif);font-size:24px;display:block}.stat small{color:var(--muted)}
.tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:26px 0 18px;position:sticky;top:0;padding:10px 0;background:linear-gradient(var(--paper) 80%,transparent);z-index:5}
.tools input{flex:1 1 260px;max-width:380px;padding:8px 16px;border:1px solid var(--line);border-radius:99px;background:var(--card);font:inherit;font-size:15px}
.tools button{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:5px 14px;font:inherit;font-size:14px;cursor:pointer;color:var(--muted)}
.tools button.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:20px}
.book{background:var(--card);border-radius:20px;box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column;transition:transform .2s,box-shadow .2s;position:relative}
.book:hover{transform:translateY(-3px);box-shadow:0 2px 4px rgba(60,40,10,.1),0 16px 36px rgba(60,40,10,.14)}
.spine{height:8px;background:var(--k)}
.k-explainer{--k:var(--accent)}.k-textbook{--k:var(--blue)}.k-proof{--k:var(--violet)}
.b-body{padding:20px 22px 16px;display:flex;flex-direction:column;gap:6px;flex:1}
.badge{align-self:flex-start;font-size:12px;letter-spacing:.06em;color:#fff;background:var(--k);border-radius:6px;padding:1px 9px}
.book h2{font-family:var(--serif);font-size:26px;margin:4px 0 0;line-height:1.3}
.book h2 a{color:inherit;text-decoration:none}.book h2 a:hover{color:var(--accent)}
.en{font-family:var(--serif);font-style:italic;color:var(--muted);font-size:15px}
.author{font-size:14px;color:var(--muted)}
.intro{font-size:14.5px;margin:6px 0 4px;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.prog{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted);margin-top:auto;padding-top:8px}
.bar{flex:1;height:6px;border-radius:99px;background:var(--paper2);overflow:hidden}.bar i{display:block;height:100%;background:var(--k)}
.chs{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chs a{font-size:12.5px;text-decoration:none;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:1px 8px;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.chs a:hover{border-color:var(--k);color:var(--k)}
.chs a.off{opacity:.45;pointer-events:none}
.b-foot{display:flex;gap:10px;padding:12px 22px 18px}
.btn{flex:1;text-align:center;text-decoration:none;border-radius:12px;padding:8px 0;font-size:15px;background:var(--k);color:#fff}
.btn.ghost{background:none;color:var(--k);border:1px solid var(--k)}
.empty{color:var(--muted);padding:40px 0;text-align:center}
footer{margin-top:70px;text-align:center;color:var(--muted);font-size:13px}
@media(max-width:520px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<main>
  <header>
    <div class="kicker">图书讲透 · LIBRARY</div>
    <h1>书库</h1>
    <div class="sub">把难读的书做成交互式学习站点：人文经典拆成核心概念、论证主线与互动图解；数理教科书保留完整推导，每个公式可放大、每个符号可点开；论文讲解配证明依赖图与可运行示例。</div>
    <div class="stats" id="stats"></div>
  </header>
  <div class="tools">
    <input id="q" placeholder="搜索书名、作者、章节…" autocomplete="off">
    <span id="kinds"></span>
  </div>
  <div class="grid" id="grid"></div>
  <footer>所有页面均为静态文件，可离线保存或部署到任意静态托管（如 GitHub Pages）。</footer>
</main>
<script>
const KIND = { explainer: "人文导读", textbook: "数理教科书", proof: "论文 · 定理证明" };
const strip = s => String(s || "").replace(/\$([^$]*)\$/g, "$1").replace(/\\(mathrm|text|rm|operatorname)\{([^}]*)\}/g, "$2").replace(/\\[a-zA-Z]+/g, "").replace(/[{}^_]/g, "");
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
let BOOKS = [], kind = "*";

function chapterLabel(c) { return /^\d+$/.test(String(c.no)) ? (c.no === 0 ? c.title_zh : `${c.no} ${c.title_zh}`) : `${c.no} ${c.title_zh}`; }
function card(b) {
  const total = b.chapters.length, ready = b.chapters.filter(c => c.ready).length;
  const chs = b.chapters.map(c => `<a class="${c.ready ? "" : "off"}" href="${esc(b.slug)}/${esc(c.id)}/" title="${esc(strip(c.one_liner || c.title_en))}">${esc(chapterLabel(c))}</a>`).join("");
  return `<article class="book k-${esc(b.kind)}">
    <div class="spine"></div>
    <div class="b-body">
      <span class="badge">${esc(KIND[b.kind] || b.kind)}</span>
      <h2><a href="${esc(b.slug)}/">${esc(b.title)}</a></h2>
      <div class="en">${esc(b.title_en || "")}</div>
      <div class="author">${esc(b.author || "")}${b.subtitle ? " · " + esc(strip(b.subtitle)) : ""}</div>
      <div class="intro">${esc(strip(b.intro))}</div>
      <div class="chs">${chs}</div>
      <div class="prog"><span>已完成 ${ready} / ${total} 章</span><span class="bar"><i style="width:${total ? ready / total * 100 : 0}%"></i></span></div>
    </div>
    <div class="b-foot">
      <a class="btn" href="${esc(b.slug)}/">进入书架</a>
      ${b.connections ? `<a class="btn ghost" href="${esc(b.slug)}/connections/">全书脉络</a>` : ""}
    </div>
  </article>`;
}
function render() {
  const q = document.getElementById("q").value.trim().toLowerCase();
  const list = BOOKS.filter(b => (kind === "*" || b.kind === kind) &&
    (!q || [b.title, b.title_en, b.author, b.intro, ...b.chapters.map(c => c.title_zh + " " + c.title_en)].join(" ").toLowerCase().includes(q)));
  document.getElementById("grid").innerHTML = list.length ? list.map(card).join("") : `<div class="empty">没有匹配的书</div>`;
}
fetch("library.json").then(r => r.json()).then(lib => {
  BOOKS = lib.books;
  const ch = BOOKS.reduce((n, b) => n + b.chapters.filter(c => c.ready).length, 0);
  document.getElementById("stats").innerHTML =
    `<div class="stat"><b>${BOOKS.length}</b><small>本书</small></div><div class="stat"><b>${ch}</b><small>个已完成的章节页</small></div>` +
    Object.keys(KIND).filter(k => BOOKS.some(b => b.kind === k)).map(k => `<div class="stat"><b>${BOOKS.filter(b => b.kind === k).length}</b><small>${KIND[k]}</small></div>`).join("");
  const kinds = ["*", ...Object.keys(KIND).filter(k => BOOKS.some(b => b.kind === k))];
  const box = document.getElementById("kinds");
  box.innerHTML = kinds.map(k => `<button data-k="${k}" class="${k === kind ? "on" : ""}">${k === "*" ? "全部" : KIND[k]}</button>`).join(" ");
  box.onclick = e => { const k = e.target.dataset?.k; if (!k) return; kind = k; box.querySelectorAll("button").forEach(x => x.classList.toggle("on", x.dataset.k === k)); render(); };
  document.getElementById("q").oninput = render;
  render();
}).catch(e => { document.getElementById("grid").innerHTML = `<div class="empty">无法读取 library.json：${esc(e.message)}</div>`; });
</script>
</body>
</html>
